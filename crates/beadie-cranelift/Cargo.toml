[package]
name            = "beadie-cranelift"
description     = "Cranelift JIT backend adapter for beadie"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
# Not inherited from the workspace (1.70): cranelift 0.138 declares an
# MSRV of 1.97.0, so this crate cannot honour the workspace-wide floor.
rust-version           = "1.97"
repository.workspace   = true
homepage.workspace     = true
keywords.workspace     = true
categories.workspace   = true

[dependencies]
beadie-core.workspace    = true
beadie-backend.workspace = true
# All five must be the same release so exactly one cranelift lands in the
# dependency graph.
cranelift-codegen  = "0.138"
cranelift-frontend = "0.138"
cranelift-jit      = "0.138"
cranelift-module   = "0.138"
cranelift-native   = "0.138"
anyhow             = "1"

[dev-dependencies]
env_logger = "0.11"
